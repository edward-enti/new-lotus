{{define "content"}}
<div class="login-card">
  <div class="login-brand">
    <div class="login-brand-mark" aria-hidden="true">SL</div>
    <h1>Quản trị Sơn Lotus</h1>
    <p class="login-sub">Đăng nhập để quản lý sản phẩm, bài viết và yêu cầu khách hàng.</p>
  </div>
  {{if .Data.Error}}
  <div class="alert-error" role="alert">{{.Data.Error}}</div>
  {{end}}
  <form action="/admin/login" method="post" class="login-form">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label for="login-user">Tên đăng nhập</label>
      <input id="login-user" name="username" type="text" required autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass">Mật khẩu</label>
      <input id="login-pass" name="password" type="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary">Đăng nhập</button>
  </form>
</div>
{{end}}
