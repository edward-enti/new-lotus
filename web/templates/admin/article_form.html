{{define "content"}}
<div class="admin-page-head">
  <div>
    <h1>{{if .Data.IsNew}}Thêm bài viết{{else}}Sửa bài viết{{end}}</h1>
    <p class="admin-page-sub"><a href="/admin/articles">← Quay lại danh sách bài viết</a></p>
  </div>
</div>
{{if .Data.Error}}
<div class="alert-error" role="alert">{{.Data.Error}}</div>
{{end}}
<form action="{{.Data.Action}}" method="post" class="admin-form">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <fieldset class="form-section">
    <legend>Thông tin cơ bản</legend>
    <div class="field">
      <label for="af-type">Loại *</label>
      <select id="af-type" name="type" required>
        <option value="project" {{if eq .Data.Article.Type "project"}}selected{{end}}>Dự án</option>
        <option value="tech_support" {{if eq .Data.Article.Type "tech_support"}}selected{{end}}>Hỗ trợ kỹ thuật</option>
        <option value="solution" {{if eq .Data.Article.Type "solution"}}selected{{end}}>Giải pháp</option>
        <option value="news" {{if eq .Data.Article.Type "news"}}selected{{end}}>Tin tức</option>
      </select>
    </div>
    <div class="field">
      <label for="af-title">Tiêu đề *</label>
      <input id="af-title" name="title" type="text" required maxlength="300" value="{{.Data.Article.Title}}">
    </div>
    <div class="field">
      <label for="af-slug">Slug *</label>
      <input id="af-slug" name="slug" type="text" required maxlength="200" value="{{.Data.Article.Slug}}">
    </div>
    <div class="field">
      <label for="af-category">Danh mục liên quan</label>
      <select id="af-category" name="related_category_id">
        <option value="">— Không có —</option>
        {{range .Data.Categories}}
        <option value="{{.ID}}" {{if eq .ID $.Data.RelatedCategoryID}}selected{{end}}>{{.Name}}</option>
        {{end}}
      </select>
    </div>
    <div class="check-row">
      <label><input type="checkbox" name="is_featured" {{if .Data.Article.IsFeatured}}checked{{end}}> Nổi bật</label>
      <label><input type="checkbox" name="is_published" {{if .Data.Article.IsPublished}}checked{{end}}> Đã xuất bản</label>
    </div>
  </fieldset>
  <fieldset class="form-section">
    <legend>Nội dung</legend>
    <div class="field">
      <label for="af-excerpt">Tóm tắt</label>
      <textarea id="af-excerpt" name="excerpt" rows="3">{{.Data.Article.Excerpt}}</textarea>
    </div>
    <div class="field">
      <label for="af-content">Nội dung (HTML lưu trữ sẽ được hiển thị escaped ở trang công khai)</label>
      <textarea id="af-content" name="content_html" rows="10">{{.Data.Article.ContentHTML}}</textarea>
    </div>
    <div class="field">
      <label for="af-thumb">Ảnh đại diện (URL)</label>
      <input id="af-thumb" name="thumbnail_url" type="text" value="{{.Data.Article.ThumbnailURL}}">
    </div>
    <div class="field">
      <label for="af-author">Tác giả</label>
      <input id="af-author" name="author_name" type="text" value="{{.Data.Article.AuthorName}}">
    </div>
  </fieldset>
  <fieldset class="form-section">
    <legend>SEO</legend>
    <div class="field">
      <label for="af-seo-title">Tiêu đề SEO</label>
      <input id="af-seo-title" name="seo_title" type="text" value="{{.Data.Article.SEOTitle}}">
    </div>
    <div class="field">
      <label for="af-seo-desc">Mô tả SEO</label>
      <textarea id="af-seo-desc" name="seo_description" rows="2">{{.Data.Article.SEODescription}}</textarea>
    </div>
  </fieldset>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Lưu bài viết</button>
    <a href="/admin/articles" class="btn btn-secondary">Hủy</a>
  </div>
</form>
{{end}}
