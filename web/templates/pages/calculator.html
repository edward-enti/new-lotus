{{define "content"}}
<section class="page-hero">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span>Tính lượng sơn</span></nav>
    <h1>Tính lượng sơn</h1>
    <p>Nhập diện tích cần sơn, số lớp sơn và độ phủ của sản phẩm để tính lượng sơn cần dùng (đã cộng 5% hao hụt).</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <form hx-post="/api/htmx/tinh-luong-son" hx-target="#calc-result-page" class="form-card" style="max-width:720px">
      <div>
        <label class="field-label" for="calc-area">Diện tích (m²)</label>
        <input id="calc-area" name="dien-tich" type="number" step="any" min="0" required class="field-input">
      </div>
      <div>
        <label class="field-label" for="calc-coats">Số lớp sơn</label>
        <input id="calc-coats" name="so-lop" type="number" min="1" value="2" required class="field-input">
      </div>
      <div>
        <label class="field-label" for="calc-product">Sản phẩm (độ phủ tự động)</label>
        <select id="calc-product" name="san-pham" class="field-input">
          <option value="">— Nhập độ phủ thủ công —</option>
          {{range .Data.Products}}<option value="{{.Slug}}">{{.Name}} ({{.CoverageRate}} m²/lít)</option>{{end}}
        </select>
      </div>
      <div>
        <label class="field-label" for="calc-coverage">Độ phủ (m²/lít)</label>
        <input id="calc-coverage" name="do-phu" type="number" step="any" min="0.1" class="field-input">
      </div>
      <button type="submit" class="btn btn-primary">Tính lượng sơn</button>
    </form>
    <div id="calc-result-page" style="margin-top:1rem;max-width:720px"></div>
  </div>
</section>
{{end}}
